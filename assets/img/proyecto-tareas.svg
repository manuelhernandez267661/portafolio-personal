  <text x="112" y="108" fill="#aab7be" font-family="Arial,sans-serif" font-size="13">Hoy tienes 3 prioridades</text>
  <rect x="110" y="128" width="418" height="48" rx="8" fill="#414b54"/>
  <circle cx="137" cy="152" r="10" fill="#56b9b9"/>
